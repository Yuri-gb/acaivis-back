spring.application.name=acaivis-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acaivis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

admin.email=${ADMIN_EMAIL:admin@acaivis.com}
admin.password=${ADMIN_PASSWORD:ChangeMe123!}
driver.email=${DRIVER_EMAIL:entregador@acaivis.com}
driver.password=${DRIVER_PASSWORD:ChangeMe123!}

server.port=${PORT:8080}

supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

mail.from=${MAIL_FROM:}
tracking.base-url=${TRACKING_BASE_URL:http://localhost:5173/rastrear-pedido}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Mercado Pago
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}